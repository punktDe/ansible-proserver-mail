---
# Undo a previous mail.mta=postfix run, so Sendmail can bind port 25 again
# (or nothing does, with mail.enable_mta off).
- name: Check whether Postfix is installed
  ansible.builtin.stat:
    path: /usr/local/etc/rc.d/postfix
  register: mail_postfix_rc

- name: Disable Postfix service
  ansible.builtin.lineinfile:
    path: "{{ mail_rc_conf }}"
    regexp: "^(?:#[\\s\\t]*)?postfix_enable="
    state: absent

- name: Stop Postfix
  ansible.builtin.service:
    name: postfix
    state: stopped
  when: mail_postfix_rc.stat.exists

- name: Point mailer.conf at Sendmail
  ansible.builtin.copy:
    content: |
      sendmail    /usr/libexec/sendmail/sendmail
      mailq       /usr/libexec/sendmail/sendmail
      newaliases  /usr/libexec/sendmail/sendmail
      hoststat    /usr/libexec/sendmail/sendmail
      purgestat   /usr/libexec/sendmail/sendmail
    dest: /etc/mail/mailer.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Re-enable Sendmail-specific periodic jobs
  ansible.builtin.lineinfile:
    path: /etc/periodic.conf
    regexp: "^(?:#[\\s\\t]*)?{{ item }}="
    state: absent
  loop:
    - daily_clean_hoststat_enable
    - daily_status_mail_rejects_enable
    - daily_status_include_submit_mailq
    - daily_submit_queuerun
