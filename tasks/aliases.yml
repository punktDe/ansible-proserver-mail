---
# /etc/mail/aliases is the alias source for both MTAs (/etc/aliases links
# to it); newaliases runs whichever one mailer.conf points at.
- name: Define Aliases
  ansible.builtin.lineinfile:
    path: "{{ aliases }}"
    regexp: "^(?:#[\\s\\t]*)?{{ item.key }}[\\s\\t]*:"
    line: '{{ item.key }}: {{ item.value }}'
  loop_control:
    label: "{{ aliases }} src={{ item.key }} dest={{ item.value }}"
  with_dict: "{{ mail.aliases }}"
  vars:
    aliases: /etc/mail/aliases
  notify: Rebuild aliases.db
