---
- name: Ensure per-domain key directories exist
  ansible.builtin.file:
    path: "{{ mail.dkim.prefix.config }}/keys/{{ item.key }}"
    state: directory
    owner: "{{ mail_dkim_file_owner }}"
    group: "{{ mail_dkim_file_owner }}"
    mode: "0750"
  loop: "{{ mail.dkim.domains | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - dkim_generate_keys

- name: Verify each selector defines exactly one key source
  ansible.builtin.assert:
    that:
      - >-
        (item.private_key is not none and (item.private_key | length) > 0)
        != (item.autogenerate | bool)
    fail_msg: >-
      mail.dkim.domains.{{ item.domain }}.selectors.{{ item.selector }} must set
      exactly one of 'private_key' or 'autogenerate: true' — not both, and
      not neither
    quiet: true
  loop: "{{ mail_dkim_selectors }}"
  loop_control:
    label: "{{ item.domain }}/{{ item.selector }}"

- name: Write DKIM private keys that were supplied
  ansible.builtin.copy:
    content: "{{ item.private_key }}"
    dest: "{{ mail.dkim.prefix.config }}/keys/{{ item.domain }}/{{ item.selector }}.private"
    owner: "{{ mail_dkim_file_owner }}"
    group: "{{ mail_dkim_file_owner }}"
    mode: "0600"
  loop: "{{ mail_dkim_selectors }}"
  loop_control:
    label: "{{ item.domain }}/{{ item.selector }}"
  when: item.private_key is not none and (item.private_key | length) > 0
  no_log: true

- name: Check for an existing key file for each autogenerated selector
  ansible.builtin.stat:
    path: "{{ mail.dkim.prefix.config }}/keys/{{ item.domain }}/{{ item.selector }}.private"
  register: mail_dkim_autogen_stat
  loop: "{{ mail_dkim_selectors }}"
  loop_control:
    label: "{{ item.domain }}/{{ item.selector }}"
  when: item.autogenerate | bool
  tags:
    - dkim_generate_keys

# Only ever runs when explicitly requested with `--tags dkim_generate_keys`
# (the "never" tag excludes it from every other invocation, including a
# plain full run) — this role must never mint a new keypair as a side
# effect of a normal apply.
- name: Generate a DKIM private key for autogenerated selectors that don't have one yet
  ansible.builtin.command:
    cmd: >-
      opendkim-genkey
      -D {{ mail.dkim.prefix.config }}/keys/{{ item.item.domain }}
      -d {{ item.item.domain }}
      -s {{ item.item.selector }}
      -b {{ item.item.key_size }}
  loop: "{{ mail_dkim_autogen_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.domain }}/{{ item.item.selector }}"
  when: not item.skipped | default(false) and not item.stat.exists
  changed_when: true
  tags:
    - never
    - dkim_generate_keys

- name: Fix ownership and permissions on generated key files
  ansible.builtin.file:
    path: "{{ mail.dkim.prefix.config }}/keys/{{ item.item.domain }}/{{ item.item.selector }}.private"
    owner: "{{ mail_dkim_file_owner }}"
    group: "{{ mail_dkim_file_owner }}"
    mode: "0600"
  loop: "{{ mail_dkim_autogen_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.domain }}/{{ item.item.selector }}"
  when: not item.skipped | default(false) and not item.stat.exists
  tags:
    - never
    - dkim_generate_keys

- name: Determine which selectors have a key file on disk right now
  ansible.builtin.stat:
    path: "{{ mail.dkim.prefix.config }}/keys/{{ item.domain }}/{{ item.selector }}.private"
  register: mail_dkim_final_key_stat
  loop: "{{ mail_dkim_selectors }}"
  loop_control:
    label: "{{ item.domain }}/{{ item.selector }}"

- name: Warn about autogenerated selectors that still have no key file
  ansible.builtin.debug:
    msg: >-
      {{ item.item.domain }}/{{ item.item.selector }} is set to autogenerate
      but has no key file yet — run with '--tags dkim_generate_keys' to
      create it. It is left out of KeyTable/SigningTable/DNS output until
      then.
  loop: "{{ mail_dkim_final_key_stat.results }}"
  loop_control:
    label: "{{ item.item.domain }}/{{ item.item.selector }}"
  when: item.item.autogenerate | bool and not item.stat.exists

# Key material is dropped here — everything downstream only needs the key
# file on disk, and these items get echoed verbatim in task failure output.
- name: Compute the list of provisioned (key file present) DKIM selectors
  ansible.builtin.set_fact:
    mail_dkim_provisioned_selectors: >-
      {{ mail_dkim_final_key_stat.results | selectattr('stat.exists') | map(attribute='item')
         | map('combine', {'private_key': none}) | list }}

- name: Compute the list of active, provisioned DKIM selectors
  ansible.builtin.set_fact:
    mail_dkim_active_selectors: "{{ mail_dkim_provisioned_selectors | selectattr('active') | list }}"
