---
- name: Validate mail settings
  ansible.builtin.assert:
    that:
      - mail.mta in ['sendmail', 'postfix']
      - mail.dkim.on_failure in ['tempfail', 'accept']
      - mail.enable_mta or not mail_dkim_enabled
    fail_msg: >-
      mail.mta must be 'sendmail' or 'postfix' (got '{{ mail.mta }}'),
      mail.dkim.on_failure 'tempfail' or 'accept' (got
      '{{ mail.dkim.on_failure }}'), and mail.dkim.domains must be empty
      when mail.enable_mta is off.
    quiet: true

- name: Flatten DKIM domain/selector configuration
  ansible.builtin.import_tasks: dkim_flatten.yml
  when: mail_dkim_enabled
  tags:
    - dkim_generate_keys

- name: Configure DKIM keys
  ansible.builtin.import_tasks: dkim_keys.yml
  when: mail_dkim_enabled

- name: Configure OpenDKIM
  ansible.builtin.import_tasks: dkim_config.yml
  when: mail_dkim_enabled

- name: Report required DNS records
  ansible.builtin.import_tasks: dkim_dns.yml
  when: mail_dkim_enabled

# Regular tasks rather than handlers: Postfix must be gone before any
# handler starts Sendmail on port 25.
- name: Turn off Postfix
  ansible.builtin.import_tasks: postfix_disable.yml
  when: (mail.mta == 'sendmail' or not mail.enable_mta) and mail.manage_services

- name: Enable or disable Sendmail
  ansible.builtin.import_tasks: service.yml
  when: (mail.mta == 'sendmail' or not mail.enable_mta) and mail.manage_services

- name: Wire OpenDKIM into Sendmail
  ansible.builtin.import_tasks: sendmail.yml
  when: mail.enable_mta and mail.mta == 'sendmail'

# Postfix only exists as live postconf/rc.conf state, so there is nothing
# to do for it when services aren't managed (tests).
- name: Switch to Postfix and wire OpenDKIM into it
  ansible.builtin.import_tasks: postfix.yml
  when: mail.enable_mta and mail.mta == 'postfix' and mail.manage_services

- name: Define aliases
  ansible.builtin.import_tasks: aliases.yml
  when: mail.manage_services
