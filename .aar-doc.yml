  ## Installation
  Add this role to the requirements.yml of your playbook as follows:
  ```yaml
  roles:
    - name: {{ role }}
      src: https://github.com/punktDe/ansible-proserver-mail
  ```

  Afterwards, install the role by running `ansible-galaxy install -r requirements.yml`

  ## Example Playbook

  ```yaml
  - hosts: all
    roles:
      - name: ansible-proserver-mail
    vars:
      mail:
        mta: postfix
        dkim:
          domains:
            example.com:
              selectors:
                default:
                  private_key: "{% raw %}{{ secrets.dkim.example_com_default }}{% endraw %}"
                  active: yes
  ```

