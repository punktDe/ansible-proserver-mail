---
# Runs the role in test mode (mail.manage_services: no) on the standard
# platforms: renders OpenDKIM's files and the Sendmail .mc under /tmp and
# checks them; no services or system files are touched. The postfix and
# sendmail scenarios cover a real FreeBSD host.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible
    <<: &default_platform
      command: /lib/systemd/systemd
      pre_build_image: true
      privileged: true
      cgroupns_mode: host
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    <<: *default_platform
  - name: ubuntu-2604
    image: geerlingguy/docker-ubuntu2604-ansible
    <<: *default_platform
  - name: debian-12
    image: geerlingguy/docker-debian12-ansible
    <<: *default_platform
  - name: debian-13
    image: geerlingguy/docker-debian13-ansible
    <<: *default_platform
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  config_options:
    defaults:
      # The role relies on mail.* defaults merging with the play's mail dict.
      hash_behaviour: merge
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: ansible
