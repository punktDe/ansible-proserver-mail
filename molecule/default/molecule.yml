---
# Render-only scenario: runs on the controller itself (macOS or Linux, no
# FreeBSD needed) with services unmanaged, and checks the generated OpenDKIM
# files and Sendmail wiring. The sendmail/postfix scenarios cover the real
# MTA on a FreeBSD VM.
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: localhost
provisioner:
  name: ansible
  config_options:
    defaults:
      # The role relies on mail.* defaults merging with the play's mail dict.
      hash_behaviour: merge
  inventory:
    host_vars:
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
scenario:
  test_sequence:
    - cleanup
    - syntax
    - converge
    - idempotence
    - verify
    - cleanup
